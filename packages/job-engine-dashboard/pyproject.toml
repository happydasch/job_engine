[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "job-engine-dashboard"
version = "1.0.0"
description = "Web dashboard for Job Engine"
authors = [{ name = "Daniel" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "job-engine-core>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pymupdf>=1.28.0",
    "langchain-anthropic>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/happydasch/job-engine"
Repository = "https://github.com/happydasch/job-engine.git"
Issues = "https://github.com/happydasch/job-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
