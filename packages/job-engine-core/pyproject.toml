[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "job-engine-core"
version = "1.0.0"
description = "Job matching engine: scoring, database, config, LLM"
authors = [{ name = "Daniel" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/happydasch/job-engine"
Repository = "https://github.com/happydasch/job-engine.git"
Issues = "https://github.com/happydasch/job-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
