[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "job-automation-engine"
version = "1.0.0"
description = "Job scraping, matching, and dashboard automation engine"
authors = [{ name = "Daniel" }]
license = "MIT"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/happydasch/job-engine"
Repository = "https://github.com/happydasch/job-engine.git"
Issues = "https://github.com/happydasch/job-engine/issues"

[project.scripts]
job-score = "job_engine.skill_scorer:main"
job-dashboard = "dashboard.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["packages/job-engine-core/tests"]