name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a newer commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

defaults:
  run:
    shell: bash

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check packages/job-engine-core/ packages/job-engine-dashboard/

      - name: Run ruff format check
        run: ruff format --check packages/job-engine-core/ packages/job-engine-dashboard/

  # ── Type check ──────────────────────────────────────────────────────────
  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    env:
      PYRIGHT_PYTHON_FORCE_VERSION: "1.1.411"
      PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e packages/job-engine-core
          pip install -e packages/job-engine-dashboard
          pip install pyright==1.1.411

      - name: Run pyright
        run: pyright packages/job-engine-core/src/ packages/job-engine-dashboard/src/

  # ── Python tests ────────────────────────────────────────────────────────
  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            packages/job-engine-core/pyproject.toml
            packages/job-engine-dashboard/pyproject.toml

      - name: Set up CI .env
        run: cp config/.env.ci config/.env

      - name: Create necessary directories
        run: mkdir -p data/scraper-output data/active-scrapers

      - name: Install dependencies
        run: |
          pip install -e packages/job-engine-core
          pip install -e packages/job-engine-dashboard
          pip install pytest httpx

      - name: Run tests
        run: pytest packages/job-engine-core/tests/ -v --tb=short

  # ── Scraper tests ───────────────────────────────────────────────────────
  scraper-tests:
    name: Scraper tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/job-engine-scrapers/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/job-engine-scrapers/package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        working-directory: packages/job-engine-scrapers

      - name: Run tests
        run: npm test
        working-directory: packages/job-engine-scrapers

  # ── Frontend build ──────────────────────────────────────────────────────
  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/job-engine-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/job-engine-dashboard

      - name: Build frontend
        run: npm run build
        working-directory: packages/job-engine-dashboard

  # ── Docker build ────────────────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build
